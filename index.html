<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanrow - Table Scanner</title>
  <style>
    :root {
      --primary: #0F766E;
      --bg: #0F172A;
      --card-bg: #1E293B;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 32px 24px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }
    .icon {
      width: 52px;
      height: 52px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
    }
    h1 { margin: 0; font-size: 26px; font-weight: 800; }
    h2 { font-size: 20px; color: #34D399; margin-top: 32px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    p, li { color: #CBD5E1; font-size: 15px; }
    ul { padding-left: 20px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 14px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: rgba(16, 124, 65, 0.2);
      color: #34D399;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(16, 124, 65, 0.25);
      border: 1px solid #0F766E;
      border-radius: 20px;
      color: #34D399;
      font-size: 12px;
      font-weight: 600;
    }
    a { color: #34D399; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">📊</div>
      <div>
        <h1>Scanrow</h1>
        <div style="color: var(--muted); font-size: 13px; margin-top: 4px;">Scan printed tables and PDFs into editable spreadsheets.</div>
      </div>
    </div>
    <h2>Support</h2>
    <p>Questions or problems? Email <a href="mailto:androidpyus@gmail.com">androidpyus@gmail.com</a>.</p>
    <h2>Legal</h2>
    <ul>
      <li><a href="privacy/">Privacy Policy</a></li>
      <li><a href="terms/">Terms of Service</a></li>
    </ul>
  </div>
</body>
</html>
